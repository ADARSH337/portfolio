  <body>
    <!-- Premium Preloader Screen -->
    <div id="loader" class="loader">
      <div class="loader-content">
        <h1 class="loader-title">ADARSH KUNCHAM</h1>
        <div class="loader-bar-container">
          <div id="loader-bar" class="loader-bar"></div>
        </div>
        <p class="loader-subtitle">CRAFTING STORIES THROUGH MOTION</p>
      </div>
    </div>

    <!-- Cinematic Grain / Noise Texture Overlay -->
    <div class="grain-overlay"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Simple initial preloader fadeout script in case react loads slowly
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        const loaderBar = document.getElementById('loader-bar');
        if (loaderBar) {
          loaderBar.style.width = '100%';
        }
        setTimeout(() => {
          if (loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(() => {
              loader.remove();
            }, 600);
          }
        }, 800);
      });
    </script>
  </body>
